<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TiraDados - Sesion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="connection-banner" id="connection-banner">Reconectando...</div>

  <header class="session-header">
    <span class="session-code" id="session-code" title="Click para copiar">...</span>
    <span class="player-list" id="player-list"></span>
  </header>

  <main class="session-main">
    <section class="dice-area">
      <div class="dice-selector" id="dice-selector"></div>
      <div class="dice-staging" id="dice-staging">
        <div class="token-layer" id="token-layer"></div>
        <div class="dice-tray" id="dice-tray">
          <p class="placeholder">Haz click en los dados para seleccionarlos</p>
        </div>
      </div>
      <div class="token-bar">
        <span class="token-bar-label">Fichas</span>
        <div class="token-palette" id="token-palette"></div>
        <span class="token-bar-hint">Click en un color para anadir un PNJ &middot; arrastra para mover &middot; click en una ficha para editarla &middot; Alt+click para senalar</span>
      </div>
      <div class="dice-actions">
        <button class="btn-clear" id="btn-clear">Limpiar <span class="shortcut">(Esc)</span></button>
        <button class="btn-roll-hidden" id="btn-roll-hidden" disabled title="Solo lo vereis tu y el creador de la sala">Oculta <span class="shortcut">(Shift+Enter)</span></button>
        <button class="btn-roll" id="btn-roll" disabled>Tirar <span class="shortcut">(Enter)</span></button>
      </div>
    </section>

    <div class="divider" id="divider"></div>

    <section class="log" id="log">
      <div class="initiative-panel">
        <div class="initiative-head">
          <span class="log-title">Iniciativa</span>
          <button class="btn-initiative-reset" id="btn-initiative-reset" hidden title="Borra la iniciativa de toda la mesa">Reiniciar</button>
        </div>
        <div class="initiative-picker" id="initiative-picker"></div>
        <div class="initiative-order" id="initiative-order"></div>
      </div>

      <div class="log-title">Historial</div>
      <div class="log-entries" id="log-entries">
        <p class="log-empty" id="log-empty">Aun no hay tiradas</p>
      </div>
    </section>
  </main>

  <script src="js/dice-svg.js"></script>
  <script src="js/session.js"></script>
</body>
</html>
